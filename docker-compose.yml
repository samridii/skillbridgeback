version: "3.9"

services:
  backend:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - ./secure_uploads:/app/secure_uploads
      - ./logs:/app/logs

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: